[package]
name = "quicknode-cli"
version = "0.1.1"
edition = "2021"
description = "Command-line interface for the Quicknode SDK"
license = "MIT"
repository = "https://github.com/quicknode/cli"
homepage = "https://www.quicknode.com/docs/welcome"
authors = ["Quicknode <support@quicknode.com>"]
readme = "README.md"
keywords = ["quicknode", "cli", "blockchain", "web3"]
categories = ["command-line-utilities"]
rust-version = "1.75"

[[bin]]
name = "qn"
path = "src/main.rs"

[lib]
name = "qn"
path = "src/lib.rs"

[dependencies]
quicknode-sdk = "0.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toon-format = { version = "0.5", default-features = false }
comfy-table = { version = "7", default-features = false, features = ["tty"] }
dialoguer = "0.11"
toml = "0.8"
thiserror = "1"
humantime = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
base64 = "0.22"
tempfile = "3"
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
